# Render Blueprint for the CVForge API (free plan).
# Dashboard: New + > Blueprint > pick this repo. Secrets marked "sync: false" are asked for once.
services:
  - type: web
    name: cvforge-api
    runtime: node
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @cvforge/api run build
    startCommand: pnpm --filter @cvforge/api run start:prod
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # Neon POOLED connection string (host contains -pooler)
        sync: false
      - key: DIRECT_URL # Neon DIRECT connection string (no -pooler); used for migrations
        sync: false
      - key: CORS_ORIGIN # your website, e.g. https://cvforge-dev.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
